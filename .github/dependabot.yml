version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One weekly PR for the whole Next/Fumadocs stack instead of a PR per package.
      docs-stack:
        patterns:
          - "*"
    ignore:
      # @types/node follows the Node 24 base image of the Dockerfile.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
